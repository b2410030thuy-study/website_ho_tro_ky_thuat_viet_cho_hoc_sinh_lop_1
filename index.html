<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nền Tảng Học Viết Tiếng Việt Lớp 1</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        primary: '#FF6B6B',
                        secondary: '#4ECDC4',
                        accent: '#FFE66D',
                        bgLight: '#F7F9FC',
                        textDark: '#2C3E50'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #F7F9FC; color: #2C3E50; }
        .canvas-container { position: relative; width: 100%; max-width: 600px; margin: 0 auto; background: white; border-radius: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .lined-paper {
            background-image: linear-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 100% 40px;
            background-position: 0 39px;
        }
        .btn-kid { transition: all 0.2s; box-shadow: 0 4px 0px rgba(0,0,0,0.1); }
        .btn-kid:active { transform: translateY(4px); box-shadow: none; }
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
        .animate-bounce-slow { animation: bounce 2s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- HỆ THỐNG ÂM THANH (TEXT-TO-SPEECH) ---
        const speak = (text) => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop current speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'vi-VN';
                utterance.rate = 0.85; // Chậm rãi cho học sinh lớp 1
                utterance.pitch = 1.2; // Giọng hơi cao, thân thiện
                window.speechSynthesis.speak(utterance);
            }
        };

        // --- COMPONENT: WRITING CANVAS ---
        const WritingCanvas = ({ letter, onComplete }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [feedback, setFeedback] = useState("");
            const [status, setStatus] = useState("idle"); // idle, success, try_again

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = '#4ECDC4';
                ctx.lineWidth = 12;
                clearCanvas();
            }, [letter]);

            const startDrawing = (e) => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                ctx.beginPath();
                ctx.moveTo(x, y);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault(); // Ngăn cuộn trang trên mobile
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                ctx.lineTo(x, y);
                ctx.stroke();
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                setFeedback("");
                setStatus("idle");
            };

            const checkWriting = () => {
                // Mock AI Logic: Randomly decide if good or needs improvement to show both flows
                const isGood = Math.random() > 0.3; 
                if (isGood) {
                    setStatus("success");
                    setFeedback("Tuyệt vời! Con viết rất tốt! ⭐");
                    speak("Tuyệt vời! Con viết rất tốt!");
                    setTimeout(() => onComplete(), 2500);
                } else {
                    setStatus("try_again");
                    setFeedback("Gần đúng rồi! Con chú ý điểm đặt bút nhé. Hãy thử lại nào! 💪");
                    speak("Gần đúng rồi! Con chú ý điểm đặt bút nhé. Hãy thử lại nào!");
                }
            };

            return (
                <div className="flex flex-col items-center w-full">
                    <div className="flex justify-between w-full mb-4 items-center">
                        <button onClick={() => speak(`Bây giờ con hãy đặt bút vào chấm xanh và viết chữ ${letter} nhé`)} className="bg-accent text-gray-700 px-4 py-2 rounded-full font-bold btn-kid flex items-center gap-2">
                            <i className="fas fa-volume-up"></i> Nghe hướng dẫn
                        </button>
                        <div className="text-2xl font-black text-primary">Viết chữ: {letter.toUpperCase()}</div>
                    </div>
                    
                    <div className="canvas-container lined-paper border-4 border-secondary overflow-hidden relative">
                        {/* Hướng dẫn mờ bên dưới */}
                        <div className="absolute inset-0 flex items-center justify-center opacity-20 pointer-events-none select-none text-[180px] font-bold font-serif text-gray-500">
                            {letter}
                        </div>
                        {/* Chấm đặt bút giả lập */}
                        <div className="absolute left-[35%] top-[25%] w-4 h-4 bg-primary rounded-full animate-pulse pointer-events-none"></div>

                        <canvas 
                            ref={canvasRef}
                            width={500}
                            height={300}
                            className="w-full h-[300px] touch-none cursor-crosshair"
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseOut={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                        />
                    </div>

                    {feedback && (
                        <div className={`mt-6 p-4 rounded-xl text-xl font-bold w-full text-center ${status === 'success' ? 'bg-green-100 text-green-700 border-2 border-green-400' : 'bg-yellow-100 text-yellow-700 border-2 border-yellow-400'}`}>
                            {feedback}
                        </div>
                    )}

                    <div className="flex gap-4 mt-6">
                        <button onClick={clearCanvas} className="bg-gray-200 text-gray-700 px-6 py-3 rounded-full font-bold text-xl btn-kid">
                            <i className="fas fa-eraser mr-2"></i> Xóa làm lại
                        </button>
                        <button onClick={checkWriting} className="bg-primary text-white px-8 py-3 rounded-full font-bold text-xl btn-kid">
                            <i className="fas fa-check-circle mr-2"></i> Kiểm tra
                        </button>
                    </div>
                </div>
            );
        };

        // --- COMPONENT: GIAO DIỆN HỌC SINH ---
        const StudentView = ({ onLogout }) => {
            const [currentModule, setCurrentModule] = useState("home"); // home, learn, game
            const [stars, setStars] = useState(12);

            useEffect(() => {
                speak("Chào mừng con đến với thế giới chữ cái vui nhộn!");
            }, []);

            const renderHome = () => (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8 max-w-4xl mx-auto">
                    <div onClick={() => { setCurrentModule('learn'); speak('Vào bài học'); }} className="bg-white p-8 rounded-3xl shadow-lg cursor-pointer transform hover:scale-105 transition btn-kid border-4 border-secondary text-center">
                        <img src="https://cdn-icons-png.flaticon.com/512/3063/3063223.png" alt="Learn" className="w-32 h-32 mx-auto mb-4" />
                        <h2 className="text-3xl font-black text-secondary">Học Chữ Mới</h2>
                        <p className="text-gray-500 mt-2 font-bold">Luyện viết nét và chữ cái</p>
                    </div>
                    <div onClick={() => { setCurrentModule('game'); speak('Chơi trò chơi'); }} className="bg-white p-8 rounded-3xl shadow-lg cursor-pointer transform hover:scale-105 transition btn-kid border-4 border-primary text-center">
                        <img src="https://cdn-icons-png.flaticon.com/512/8002/8002157.png" alt="Game" className="w-32 h-32 mx-auto mb-4" />
                        <h2 className="text-3xl font-black text-primary">Khu Vui Chơi</h2>
                        <p className="text-gray-500 mt-2 font-bold">Chơi game nhận sao</p>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-bgLight pb-20">
                    <header className="bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-10">
                        <div className="flex items-center gap-4">
                            <button onClick={onLogout} className="text-gray-400 hover:text-primary text-2xl"><i className="fas fa-arrow-left"></i></button>
                            <div className="w-12 h-12 bg-accent rounded-full border-2 border-orange-300 flex items-center justify-center text-2xl">👦</div>
                            <div>
                                <h1 className="font-black text-xl text-textDark">Bé Bo (Lớp 1A)</h1>
                            </div>
                        </div>
                        <div className="flex items-center gap-2 bg-yellow-100 px-4 py-2 rounded-full border-2 border-yellow-400">
                            <i className="fas fa-star text-yellow-500 text-2xl animate-bounce-slow"></i>
                            <span className="font-black text-2xl text-yellow-700">{stars}</span>
                        </div>
                    </header>

                    <div className="p-4">
                        {currentModule === 'home' && renderHome()}
                        {currentModule === 'learn' && (
                            <div className="max-w-4xl mx-auto mt-4 bg-white p-6 rounded-3xl shadow-sm">
                                <div className="flex justify-between items-center mb-8">
                                    <button onClick={() => setCurrentModule('home')} className="text-xl font-bold text-gray-500"><i className="fas fa-chevron-left"></i> Quay lại</button>
                                    <h2 className="text-3xl font-black text-secondary">Bài 1: Chữ a, ă, â</h2>
                                    <div className="w-20"></div>
                                </div>
                                <WritingCanvas letter="a" onComplete={() => {
                                    setStars(s => s + 3);
                                    setTimeout(() => setCurrentModule('home'), 2000);
                                }} />
                            </div>
                        )}
                        {currentModule === 'game' && (
                            <div className="max-w-4xl mx-auto mt-4 bg-white p-6 rounded-3xl shadow-sm text-center">
                                <div className="flex justify-between items-center mb-8">
                                    <button onClick={() => setCurrentModule('home')} className="text-xl font-bold text-gray-500"><i className="fas fa-chevron-left"></i> Quay lại</button>
                                    <h2 className="text-3xl font-black text-primary">Bắt Chữ Cái</h2>
                                    <div className="w-20"></div>
                                </div>
                                <div className="h-64 bg-blue-50 rounded-2xl border-4 border-dashed border-blue-200 flex flex-col items-center justify-center">
                                    <img src="https://cdn-icons-png.flaticon.com/512/5754/5754388.png" className="w-24 mb-4 opacity-50" />
                                    <h3 className="text-2xl font-bold text-gray-400">Trò chơi đang được phát triển...</h3>
                                    <button onClick={() => { setStars(s => s + 1); speak("Thưởng con 1 sao!"); }} className="mt-4 bg-yellow-400 text-yellow-900 font-bold px-6 py-2 rounded-full">Tặng 1 sao test</button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- COMPONENT: GIAO DIỆN GIÁO VIÊN ---
        const TeacherView = ({ onLogout }) => {
            const [activeTab, setActiveTab] = useState('dashboard'); // dashboard, ai_worksheet
            const [aiPrompt, setAiPrompt] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [generatedWorksheet, setGeneratedWorksheet] = useState(null);

            const handleGenerateAI = () => {
                if(!aiPrompt) return;
                setIsGenerating(true);
                // Mock AI API Call delay
                setTimeout(() => {
                    setGeneratedWorksheet({
                        title: "Phiếu Luyện Viết: Nét cơ bản & Chữ A",
                        content: "Dựa trên yêu cầu: " + aiPrompt,
                        rows: [
                            { type: 'trace', chars: ['a', 'a', 'a', 'a', 'a'] },
                            { type: 'write', chars: ['a', '', '', '', ''] },
                            { type: 'trace', chars: ['ă', 'ă', 'ă', 'ă', 'ă'] },
                        ]
                    });
                    setIsGenerating(false);
                }, 1500);
            };

            const printWorksheet = () => {
                window.print();
            };

            return (
                <div className="min-h-screen bg-gray-50 flex">
                    {/* Sidebar */}
                    <div className="w-64 bg-white border-r border-gray-200 flex flex-col no-print">
                        <div className="p-6 border-b border-gray-100 flex items-center gap-3">
                            <div className="bg-primary text-white w-10 h-10 rounded-lg flex items-center justify-center font-bold text-xl"><i className="fas fa-chalkboard-teacher"></i></div>
                            <div>
                                <h2 className="font-bold text-textDark">Cô Mai</h2>
                                <p className="text-xs text-gray-500">Lớp 1A - GVCN</p>
                            </div>
                        </div>
                        <nav className="flex-1 p-4 flex flex-col gap-2">
                            <button onClick={() => setActiveTab('dashboard')} className={`flex items-center gap-3 p-3 rounded-xl font-bold transition ${activeTab === 'dashboard' ? 'bg-blue-50 text-blue-600' : 'text-gray-500 hover:bg-gray-50'}`}>
                                <i className="fas fa-chart-pie w-6"></i> Tổng quan lớp
                            </button>
                            <button onClick={() => setActiveTab('ai_worksheet')} className={`flex items-center gap-3 p-3 rounded-xl font-bold transition ${activeTab === 'ai_worksheet' ? 'bg-blue-50 text-blue-600' : 'text-gray-500 hover:bg-gray-50'}`}>
                                <i className="fas fa-magic w-6"></i> AI Tạo bài tập
                            </button>
                        </nav>
                        <div className="p-4 border-t border-gray-100">
                            <button onClick={onLogout} className="flex items-center gap-3 p-3 rounded-xl font-bold text-red-500 hover:bg-red-50 w-full transition">
                                <i className="fas fa-sign-out-alt w-6"></i> Đăng xuất
                            </button>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 p-8 overflow-y-auto">
                        {activeTab === 'dashboard' && (
                            <div className="max-w-5xl mx-auto no-print">
                                <h1 className="text-2xl font-bold text-textDark mb-6">Thống kê Lớp 1A</h1>
                                <div className="grid grid-cols-3 gap-6 mb-8">
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                                        <div className="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-xl"><i className="fas fa-users"></i></div>
                                        <div><p className="text-gray-500 text-sm font-bold">Học sinh</p><p className="text-2xl font-black">32</p></div>
                                    </div>
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                                        <div className="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-xl"><i className="fas fa-check-circle"></i></div>
                                        <div><p className="text-gray-500 text-sm font-bold">Hoàn thành bài tập</p><p className="text-2xl font-black">86%</p></div>
                                    </div>
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                                        <div className="w-12 h-12 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center text-xl"><i className="fas fa-exclamation-triangle"></i></div>
                                        <div><p className="text-gray-500 text-sm font-bold">Cần kèm thêm (Nét móc)</p><p className="text-2xl font-black">5 em</p></div>
                                    </div>
                                </div>
                                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                                    <h2 className="font-bold text-lg mb-4">Hoạt động gần đây</h2>
                                    <div className="space-y-4">
                                        {['Bé Bo đã hoàn thành bài nét ngang (Thưởng 3 sao)', 'Bé Na gặp khó khăn ở chữ ă', 'Bé Tít đạt điểm tối đa game Bắt Chữ'].map((msg, i) => (
                                            <div key={i} className="flex items-center gap-3 p-3 bg-gray-50 rounded-lg">
                                                <i className={`fas fa-circle text-[10px] ${i === 1 ? 'text-red-400' : 'text-green-400'}`}></i>
                                                <span className="text-sm font-semibold text-gray-700">{msg}</span>
                                                <span className="ml-auto text-xs text-gray-400">10 phút trước</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'ai_worksheet' && (
                            <div className="max-w-4xl mx-auto">
                                <div className="no-print">
                                    <h1 className="text-2xl font-bold text-textDark mb-2"><i className="fas fa-robot text-primary mr-2"></i> Trợ giảng AI tạo Phiếu Bài Tập</h1>
                                    <p className="text-gray-500 mb-6 text-sm">Nhập yêu cầu bằng ngôn ngữ tự nhiên, AI sẽ thiết kế phiếu luyện chữ phù hợp.</p>
                                    
                                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-6 flex gap-4">
                                        <input 
                                            type="text" 
                                            className="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-4 font-semibold text-gray-700 focus:outline-none focus:border-primary"
                                            placeholder="Ví dụ: Tạo 10 bài tập luyện viết chữ a, ă, â cho học sinh mức cơ bản..."
                                            value={aiPrompt}
                                            onChange={(e) => setAiPrompt(e.target.value)}
                                            onKeyDown={(e) => e.key === 'Enter' && handleGenerateAI()}
                                        />
                                        <button 
                                            onClick={handleGenerateAI}
                                            disabled={isGenerating || !aiPrompt}
                                            className="bg-primary hover:bg-red-500 text-white font-bold py-3 px-6 rounded-xl transition flex items-center gap-2 disabled:opacity-50"
                                        >
                                            {isGenerating ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-magic"></i>}
                                            Tạo phiếu
                                        </button>
                                    </div>
                                </div>

                                {generatedWorksheet && (
                                    <div className="bg-white border-2 border-gray-200 shadow-lg rounded-xl relative overflow-hidden">
                                        {/* Thanh công cụ in */}
                                        <div className="bg-gray-100 border-b border-gray-200 p-3 flex justify-between items-center no-print">
                                            <div className="font-bold text-gray-600"><i className="fas fa-file-alt mr-2"></i> Trình xem trước (Khổ A4)</div>
                                            <div className="flex gap-2">
                                                <button className="bg-white border border-gray-300 text-gray-700 px-4 py-1.5 rounded text-sm font-bold hover:bg-gray-50"><i className="fas fa-edit"></i> Sửa</button>
                                                <button onClick={printWorksheet} className="bg-secondary text-white px-4 py-1.5 rounded text-sm font-bold hover:bg-teal-500"><i className="fas fa-print"></i> In / Xuất PDF</button>
                                            </div>
                                        </div>
                                        
                                        {/* Khu vực In thực tế */}
                                        <div id="print-area" className="p-8 bg-white text-black min-h-[500px]">
                                            <div className="flex justify-between items-end border-b-2 border-black pb-4 mb-8">
                                                <div>
                                                    <h2 className="text-xl font-bold uppercase">Trường Tiểu Học Mùa Xuân</h2>
                                                    <p className="text-sm">Lớp: 1A - Giáo viên: Cô Mai</p>
                                                </div>
                                                <div className="text-right">
                                                    <p className="text-sm">Họ và tên: ......................................................</p>
                                                    <p className="text-sm mt-2">Điểm: ......... / Lời phê: ..............................</p>
                                                </div>
                                            </div>

                                            <h1 className="text-center text-3xl font-black mb-2">{generatedWorksheet.title}</h1>
                                            <p className="text-center text-gray-600 italic mb-10 text-sm">{generatedWorksheet.content}</p>

                                            <div className="space-y-12">
                                                {generatedWorksheet.rows.map((row, i) => (
                                                    <div key={i} className="flex gap-4 w-full justify-between px-8 lined-paper h-16 border-l-2 border-r-2 border-red-200">
                                                        {row.chars.map((char, j) => (
                                                            <div key={j} className={`text-5xl font-serif leading-[60px] ${row.type === 'trace' && char ? 'text-gray-300 opacity-50 border-gray-300 border-dashed border p-2' : 'text-black'}`}>
                                                                {char || ' '}
                                                            </div>
                                                        ))}
                                                    </div>
                                                ))}
                                            </div>
                                            
                                            <div className="mt-20 flex justify-center no-print">
                                                <div className="text-gray-300 text-sm">-- Hết --</div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- COMPONENT: APP CHÍNH (QUẢN LÝ ĐIỀU HƯỚNG) ---
        const App = () => {
            const [role, setRole] = useState(null); // 'student' | 'teacher'

            if (!role) {
                return (
                    <div className="min-h-screen bg-bgLight flex flex-col items-center justify-center p-4">
                        <div className="mb-12 text-center">
                            <h1 className="text-4xl md:text-5xl font-black text-textDark mb-4">
                                <span className="text-primary">Vui Học</span> <span className="text-secondary">Viết Chữ</span>
                            </h1>
                            <p className="text-gray-500 font-bold text-lg">Nền tảng giáo dục tương tác Tiếng Việt Lớp 1</p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-3xl">
                            <button 
                                onClick={() => setRole('student')}
                                className="bg-white p-10 rounded-3xl shadow-xl flex flex-col items-center gap-6 transform hover:-translate-y-2 transition duration-300 border-b-8 border-primary btn-kid"
                            >
                                <div className="w-32 h-32 bg-red-100 rounded-full flex items-center justify-center text-6xl">👦</div>
                                <h2 className="text-3xl font-black text-textDark">Học Sinh</h2>
                                <p className="text-gray-500 font-semibold">Vào học và chơi game</p>
                            </button>

                            <button 
                                onClick={() => setRole('teacher')}
                                className="bg-white p-10 rounded-3xl shadow-xl flex flex-col items-center gap-6 transform hover:-translate-y-2 transition duration-300 border-b-8 border-secondary btn-kid"
                            >
                                <div className="w-32 h-32 bg-teal-100 rounded-full flex items-center justify-center text-6xl">👩‍🏫</div>
                                <h2 className="text-3xl font-black text-textDark">Giáo Viên</h2>
                                <p className="text-gray-500 font-semibold">Quản lý và giao bài tập</p>
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div>
                    {role === 'student' && <StudentView onLogout={() => setRole(null)} />}
                    {role === 'teacher' && <TeacherView onLogout={() => setRole(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
